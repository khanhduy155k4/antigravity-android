name: Build and Release Antigravity APKs

on:
  push:
    tags:
      - 'v*' 
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v2.32.0)'
        required: false
        default: 'v2.32.0'
      draft:
        description: 'Create Draft Release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false
      vendor_url:
        description: 'Optional direct URL to download vendor inputs archive (core, glibc, certs, seed, shims)'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build Both Release Editions
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Java JDK (Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android Build Tools & System Utilities
        run: |
          # Use pre-installed Android SDK build-tools on GitHub Actions runner
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$BUILD_TOOLS_DIR" ] && [ -f "$BUILD_TOOLS_DIR/aapt" ]; then
            echo "[CI] Found pre-installed Android SDK build-tools at $BUILD_TOOLS_DIR"
            echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
            sudo ln -sf "$BUILD_TOOLS_DIR/aapt" /usr/local/bin/aapt
            sudo ln -sf "$BUILD_TOOLS_DIR/zipalign" /usr/local/bin/zipalign
            sudo ln -sf "$BUILD_TOOLS_DIR/apksigner" /usr/local/bin/apksigner
          else
            sudo apt-get update && sudo apt-get install -y aapt zipalign apksigner || true
          fi
          sudo apt-get install -y file zip unzip gzip || true

      - name: Prepare Vendor Inputs & Signing Keystore
        env:
          VENDOR_URL: ${{ inputs.vendor_url || secrets.VENDOR_DOWNLOAD_URL }}
        run: |
          mkdir -p tools
          
          # 1. Generate debug keystore if absent
          if [ ! -f "tools/debug.keystore" ]; then
            echo "[CI] Generating debug keystore..."
            keytool -genkey -v -keystore tools/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Setup Android API 28 android.jar if absent
          if [ ! -f "tools/android.jar" ]; then
            echo "[CI] Fetching android.jar (API 28)..."
            curl -fsSL -o tools/android.jar "https://github.com/Sable/android-platforms/raw/master/android-28/android.jar" || \
            curl -fsSL -o tools/android.jar "https://raw.githubusercontent.com/iBotPeaches/platform_frameworks_base/master/android-28.jar"
          fi

          # 3. Setup R8 / D8 compiler jar if absent
          if [ ! -f "tools/r8.jar" ]; then
            echo "[CI] Fetching r8.jar..."
            curl -fsSL -o tools/r8.jar "https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.2.42/r8-8.2.42.jar"
          fi

          # 4. Handle optional external vendor archive override
          if [ -n "$VENDOR_URL" ]; then
            echo "[CI] Downloading vendor inputs from $VENDOR_URL..."
            mkdir -p vendor
            curl -fsSL -o vendor.tar.gz "$VENDOR_URL"
            tar -xzf vendor.tar.gz -C vendor
            export AGY_HOME="$PWD/vendor"
          fi


      - name: Build Standard Release APK (dist/antigravity.apk)
        run: |
          bash build.sh

      - name: Build Region Bypass Release APK (dist/antigravity-region-bypass.apk)
        run: |
          bash build.sh --region-bypass

      - name: Compute Cryptographic Checksums
        run: |
          cd dist
          sha256sum antigravity.apk antigravity-region-bypass.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-Binaries-arm64
          path: |
            dist/antigravity.apk
            dist/antigravity-region-bypass.apk
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ format('Antigravity for Android {0}', github.event.inputs.tag_name || github.ref_name) }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          make_latest: true
          files: |
            dist/antigravity.apk
            dist/antigravity-region-bypass.apk
            dist/SHA256SUMS.txt
          body: |
            <div align="center">
              <h3>Antigravity for Android</h3>
              <p>Autonomous AI Coding Environment &bull; Native Bionic Userspace &bull; ARM64</p>
            </div>

            ---

            ### Packages & Artifacts

            | Package | Description |
            | :--- | :--- |
            | **`antigravity.apk`** | Standard production release with native bionic engine (com.agy, port 45157) |
            | **`antigravity-region-bypass.apk`** | Region bypass edition with account eligibility check bypass (com.agy, port 45157) |
            | **`SHA256SUMS.txt`** | Cryptographic checksums for package integrity verification |

            ---

            ### Key Highlights in Antigravity v2.32.0 for Android

            * **Full PC v2.32.0 Core & Web UI Port:** Upgraded embedded `language_server` (`226 MB`, `go1.28-20261102-RC00`) and standalone Jetski Web UI directly from Google's official `2.32.0` Linux ARM64 distribution — including **`/swarm`**, **Dynamic Workflows**, **Knowledge Work UI**, **Gemini 4 Hydrogen & Carbon**, **Voice assets**, and **`shiki_worker` syntax highlighting**.
            * **Generalized ARM64 Binary Patching (`modules/patches`):** Updated `crash_suppressor` for `2.32.0` Go runtime (`cpu_feature` + main/helper `preinit_atomic`), alongside `cli_gate`, `enterprise_auth`, `faccessat2`/`fchmodat2` seccomp retargeting, `sigill_handler`, `resolv_redirect`, and `pty_shell`.
            * **v2.32.0 Android WebView Bridges & Background Recovery:** Ported `Hca`->`jda` transport reconnect, `NDa`->`AQa` summary stream recovery, `r7`/`rad` deep-linking, `otc`/`rtc` React sidebar idle proof, `interactive-widget=resizes-content` keyboard sizing, and Appearance Desktop Mode toggle.
            * **Web Asset Refresh on Update:** `CoreInstaller` cleanly wipes stale `filesDir/web` assets when upgrading from v2.4.x to v2.32.0.
            * **Seamless Upgrades:** Signed with the consistent embedded keystore (`DC:94:10:46:...`), allowing direct in-place upgrades over previous v2.x releases without losing sessions or local projects.
